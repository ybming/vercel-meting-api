<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/favicon.png">
    <title>🧪 API 测试 · Meting API</title>
    <link rel="stylesheet" href="https://unpkg.com/aplayer/dist/APlayer.min.css">
    <style>
        :root {
            --primary: #6366f1;
            --primary-bg: rgba(99,102,241,0.07);
            --success: #10b981;
            --success-bg: rgba(16,185,129,0.07);
            --warning: #f59e0b;
            --warning-bg: rgba(245,158,11,0.07);
            --text: #1e293b;
            --text-secondary: #64748b;
            --text-muted: #94a3b8;
            --bg: #f1f5f9;
            --bg-card: #ffffff;
            --border: #e2e8f0;
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.04), 0 1px 2px rgba(0,0,0,0.03);
            --shadow: 0 2px 8px rgba(0,0,0,0.06);
            --radius: 10px;
            --radius-sm: 6px;
            --transition: 0.2s cubic-bezier(0.4,0,0.2,1);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
            background: var(--bg);
            min-height: 100vh;
            color: var(--text);
            -webkit-font-smoothing: antialiased;
        }
        .header {
            background: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 16px 0;
            position: sticky;
            top: 0;
            z-index: 50;
        }
        .header-inner {
            max-width: 960px; margin: 0 auto; padding: 0 24px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .header-left { display: flex; align-items: center; gap: 12px; }
        .header h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
        .header-badge {
            display: inline-flex; align-items: center; gap: 6px;
            padding: 4px 12px; border-radius: 20px;
            font-size: 12px; font-weight: 600;
            background: var(--success-bg); color: var(--success);
        }
        .status-dot {
            width: 7px; height: 7px; border-radius: 50%;
            background: var(--success); animation: pulse 2s ease-in-out infinite;
        }
        .back-link { color: var(--primary); text-decoration: none; font-size: 13px; font-weight: 600; transition: var(--transition); }
        .back-link:hover { text-decoration: underline; }
        .container { max-width: 960px; margin: 0 auto; padding: 28px 24px; }
        .section-title {
            font-size: 15px; font-weight: 700; color: var(--text);
            margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
        }
        .section-title .platform-icon { font-size: 20px; }
        .section-hint {
            font-size: 12px; color: var(--text-muted); font-weight: 500;
            margin-left: auto;
        }
        .player-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            margin-bottom: 16px;
            overflow: hidden;
            transition: box-shadow var(--transition);
        }
        .player-card:hover { box-shadow: var(--shadow); }
        .player-label {
            padding: 14px 20px 0;
            font-size: 13px; font-weight: 600; color: var(--text-secondary);
            display: flex; align-items: center; gap: 8px;
        }
        .player-label .type-badge {
            display: inline-flex; padding: 2px 8px; border-radius: 12px;
            font-size: 11px; font-weight: 600;
            background: var(--primary-bg); color: var(--primary);
        }
        .player-wrap { padding: 12px 20px 20px; }
        .player-meta {
            padding: 0 20px 12px; font-size: 11px; color: var(--text-muted);
            font-family: 'SF Mono', 'Fira Code', monospace;
            word-break: break-all;
        }
        .divider { margin: 32px 0 24px; border: none; border-top: 1px solid var(--border); }
        .playform-card {
            background: var(--bg-card);
            border-radius: var(--radius);
            box-shadow: var(--shadow-sm);
            border: 1px solid var(--border);
            margin-bottom: 24px;
            padding: 20px;
        }
        .playform-card .card-title {
            font-size: 14px; font-weight: 700; margin-bottom: 14px;
            display: flex; align-items: center; gap: 8px;
        }
        .form-row {
            display: grid; grid-template-columns: 1fr 1fr auto; gap: 10px; align-items: end;
        }
        @media (max-width: 640px) {
            .form-row { grid-template-columns: 1fr 1fr; }
            .form-row .load-btn { grid-column: span 2; }
        }
        .form-group label {
            display: block; font-size: 11px; font-weight: 700;
            color: var(--text-muted); text-transform: uppercase;
            letter-spacing: 0.5px; margin-bottom: 4px;
        }
        .form-group select, .form-group input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            font-size: 13px; font-family: inherit;
            background: var(--bg); color: var(--text);
            transition: var(--transition);
        }
        .form-group select:focus, .form-group input:focus {
            outline: none; border-color: var(--primary); background: var(--bg-card);
            box-shadow: 0 0 0 3px var(--primary-bg);
        }
        .load-btn {
            padding: 10px 20px;
            background: var(--primary); color: #fff;
            border: none; border-radius: var(--radius-sm);
            font-size: 13px; font-weight: 600; font-family: inherit;
            cursor: pointer; transition: var(--transition);
            min-height: 40px;
        }
        .load-btn:hover { background: var(--primary-dark); }
        .load-btn:active { transform: scale(0.97); }

        footer { text-align: center; padding: 24px; color: var(--text-muted); font-size: 13px; }
        footer a { color: var(--primary); text-decoration: none; }
        footer a:hover { text-decoration: underline; }

        @keyframes pulse { 0%, 100% { box-shadow: 0 0 0 2px var(--success-bg); } 50% { box-shadow: 0 0 0 5px rgba(16,185,129,0.1); } }

        @media (max-width: 768px) {
            .container { padding: 16px 14px; }
            .header-inner { padding: 0 14px; }
            .player-wrap { padding: 10px 14px 14px; }
            .player-label { padding: 12px 14px 0; font-size: 12px; }
            .player-meta { padding: 0 14px 10px; font-size: 10px; }
            .section-title { font-size: 14px; margin-bottom: 12px; }
            .player-card { margin-bottom: 12px; }
            .playform-card { padding: 16px; margin-bottom: 16px; }
        }
        @media (max-width: 480px) {
            .header h1 { font-size: 15px; }
            .header-badge { font-size: 11px; padding: 3px 8px; }
            .back-link { font-size: 12px; }
            .container { padding: 12px 10px; }
            .player-wrap { padding: 8px 10px 10px; }
            .player-label { padding: 10px 10px 0; }
            .type-badge { font-size: 10px; }
            footer { padding: 16px 12px; font-size: 12px; }
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="header-inner">
            <div class="header-left">
                <h1>🧪 API 测试</h1>
                <span class="header-badge"><span class="status-dot"></span>在线</span>
            </div>
            <a class="back-link" href="../">← 返回首页</a>
        </div>
    </div>

    <div class="container">
        <script src="https://unpkg.com/aplayer/dist/APlayer.min.js"></script>
        <script>
            // 让 Meting.js 使用当前域名的 API
            window.meting_api = window.location.origin + '/?server=:server&type=:type&id=:id&auth=:auth&r=:r';
        </script>
        <script src="https://unpkg.com/@xizeyoupan/meting@latest/dist/Meting.min.js"></script>

        <!-- 自定义加载器 -->
        <div class="playform-card">
            <div class="card-title">🎛️ 自定义加载</div>
            <div class="form-row">
                <div class="form-group">
                    <label>数据源</label>
                    <select id="f-server">
                        <option value="netease">netease（网易云）</option>
                        <option value="tencent">tencent（QQ音乐）</option>
                        <option value="kugou">kugou（酷狗）</option>
                        <option value="kuwo">kuwo（酷我）</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>类型</label>
                    <select id="f-type">
                        <option value="playlist">playlist（歌单）</option>
                        <option value="song">song（单曲）</option>
                        <option value="artist">artist（歌手）</option>
                        <option value="search">search（搜索）</option>
                    </select>
                </div>
                <div class="form-group" style="grid-column: span 2;">
                    <label>ID / 关键词</label>
                    <input id="f-id" type="text" placeholder="歌单ID / 歌曲ID / 关键词" value="2619366284">
                </div>
                <button class="load-btn" onclick="loadCustom()">▶ 加载</button>
            </div>
        </div>

        <!-- 网易云音乐 -->
        <div class="section-title">
            <span class="platform-icon">🎶</span>
            网易云音乐
            <span class="section-hint">✅ 完全可用</span>
        </div>

        <div class="player-card">
            <div class="player-label">
                歌单 · 云音乐飙升榜
                <span class="type-badge">playlist</span>
            </div>
            <div class="player-wrap">
                <meting-js server="netease" type="playlist" id="2619366284" list-folded="true"></meting-js>
            </div>
        </div>

        <div class="player-card">
            <div class="player-label">
                单曲 · 周杰伦 - 稻香
                <span class="type-badge">song</span>
            </div>
            <div class="player-wrap">
                <meting-js server="netease" type="song" id="416892104" list-folded="true"></meting-js>
            </div>
        </div>

        <hr class="divider">

        <!-- QQ 音乐 -->
        <div class="section-title">
            <span class="platform-icon">🎵</span>
            QQ 音乐
            <span class="section-hint">⚠️ 海外IP可能无法播放</span>
        </div>

        <div class="player-card">
            <div class="player-label">
                歌单
                <span class="type-badge">playlist</span>
            </div>
            <div class="player-wrap">
                <meting-js server="tencent" type="playlist" id="9697595502" list-folded="true"></meting-js>
            </div>
        </div>

        <div class="player-card">
            <div class="player-label">
                单曲
                <span class="type-badge">song</span>
            </div>
            <div class="player-wrap">
                <meting-js server="tencent" type="song" id="002Rnpvi058Qdm" list-folded="true"></meting-js>
            </div>
        </div>

    </div>

    <footer>
        Powered by <a href="https://github.com/ybming/vercel-meting-api" target="_blank">Meting</a> ·
        <a href="../">← 返回首页</a>
    </footer>

    <script>
    // 自定义加载
    function loadCustom() {
        var server = document.getElementById('f-server').value;
        var type = document.getElementById('f-type').value;
        var id = document.getElementById('f-id').value.trim();
        if (!id) { alert('请输入 ID 或关键词'); return; }

        // 移除旧的自定义播放器
        var old = document.getElementById('custom-player');
        if (old) old.remove();

        // 插入新播放器到页面顶部（自定义表单之后）
        var card = document.createElement('div');
        card.className = 'player-card';
        card.id = 'custom-player';
        card.style.animation = 'fadeUp 0.4s ease';
        card.innerHTML =
            '<div class="player-label">自定义加载 <span class="type-badge">' + server + ' / ' + type + '</span></div>' +
            '<div class="player-wrap">' +
            '  <meting-js server="' + server + '" type="' + type + '" id="' + id + '" list-folded="true"></meting-js>' +
            '</div>';
        document.querySelector('.playform-card').after(card);
    }
    </script>
</body>
</html>
