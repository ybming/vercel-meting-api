<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="/favicon.png">
    <title>在线播放 · Meting</title>
    <link rel="stylesheet" href="https://unpkg.com/aplayer/dist/APlayer.min.css">
    <style>
        *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
        :root{
            --bg-0:#0a0a0f;--bg-1:#111118;--bg-card:rgba(255,255,255,.04);
            --bg-card-hover:rgba(255,255,255,.07);--border:rgba(255,255,255,.06);
            --text:#fff;--text-2:rgba(255,255,255,.7);--text-3:rgba(255,255,255,.45);--text-4:rgba(255,255,255,.28);
            --accent:#e94560;--accent-2:#ff6b9d;--accent-glow:rgba(233,69,96,.35);
            --radius-1:6px;--radius-2:10px;--radius-3:16px;--radius-full:999px;
            --transition:.25s cubic-bezier(.4,0,.2,1);
        }
        html{scroll-behavior:smooth}
        body{
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
            background:var(--bg-0);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;
            overflow-x:hidden;padding-bottom:40px;
        }
        body::before{
            content:'';position:fixed;inset:0;z-index:-2;pointer-events:none;
            background:
                radial-gradient(ellipse 80% 50% at 20% -10%,rgba(233,69,96,.18),transparent 60%),
                radial-gradient(ellipse 60% 40% at 100% 0%,rgba(99,102,241,.15),transparent 60%),
                linear-gradient(180deg,var(--bg-0) 0%,var(--bg-1) 100%);
        }

        /* Nav */
        .nav{position:sticky;top:0;z-index:100;backdrop-filter:blur(20px) saturate(160%);background:rgba(10,10,15,.7);border-bottom:1px solid var(--border)}
        .nav-inner{max-width:1200px;margin:0 auto;padding:14px 24px;display:flex;align-items:center;justify-content:space-between}
        .nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font-weight:800;font-size:18px}
        .nav-logo-icon{width:32px;height:32px;border-radius:var(--radius-1);background:linear-gradient(135deg,var(--accent),var(--accent-2));display:flex;align-items:center;justify-content:center;font-size:16px;box-shadow:0 4px 14px var(--accent-glow)}
        .nav-actions{display:flex;gap:10px;align-items:center}
        .back-btn{padding:8px 16px;border-radius:var(--radius-full);font-size:12px;font-weight:600;color:var(--text-2);text-decoration:none;border:1px solid var(--border);background:rgba(255,255,255,.04);transition:var(--transition)}
        .back-btn:hover{color:#fff;background:rgba(255,255,255,.08)}

        .container{max-width:1200px;margin:0 auto;padding:0 24px}

        /* Playlist Card + Player */
        .playlist-block{padding:32px 0}
        .playlist-head{display:flex;align-items:flex-end;gap:24px;margin-bottom:24px}
        .playlist-cover{width:160px;height:160px;border-radius:var(--radius-3);overflow:hidden;box-shadow:0 16px 48px rgba(0,0,0,.5);flex-shrink:0}
        .playlist-cover img{width:100%;height:100%;object-fit:cover;display:block}
        .playlist-info{flex:1;min-width:0}
        .playlist-label{font-size:11px;font-weight:700;color:var(--accent-2);letter-spacing:1.5px;text-transform:uppercase;margin-bottom:10px}
        .playlist-title{font-size:clamp(24px,3.5vw,36px);font-weight:800;letter-spacing:-.5px;margin-bottom:8px}
        .playlist-sub{font-size:13px;color:var(--text-3)}

        .player-card{
            background:rgba(255,255,255,.03);border:1px solid var(--border);
            border-radius:var(--radius-3);padding:8px;overflow:hidden;
            backdrop-filter:blur(10px);
        }

        /* Form Section */
        .form-section{padding:24px 0}
        .form-card{
            background:rgba(255,255,255,.03);border:1px solid var(--border);
            border-radius:var(--radius-3);padding:24px;
        }
        .form-title{font-size:15px;font-weight:700;margin-bottom:16px;display:flex;align-items:center;gap:10px}
        .form-title::before{content:'';width:4px;height:18px;border-radius:2px;background:linear-gradient(180deg,var(--accent),var(--accent-2))}
        .form-grid{display:grid;grid-template-columns:1fr 1fr 2fr auto;gap:12px;align-items:end}
        .form-group label{display:block;font-size:11px;font-weight:700;color:var(--text-3);text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px}
        .form-group select,.form-group input{
            width:100%;padding:11px 14px;border-radius:var(--radius-2);
            border:1px solid var(--border);background:rgba(255,255,255,.04);
            color:#fff;font-size:13px;font-family:inherit;transition:var(--transition);
            appearance:none;
            background-image:url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='white' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat:no-repeat;background-position:right 12px center;background-size:14px;
        }
        .form-group input{background-image:none}
        .form-group select:focus,.form-group input:focus{outline:none;border-color:var(--accent);background-color:rgba(255,255,255,.06);box-shadow:0 0 0 3px var(--accent-glow)}
        .form-group select option{background:var(--bg-1);color:#fff}
        .load-btn{
            padding:11px 24px;border:none;border-radius:var(--radius-full);
            background:linear-gradient(135deg,var(--accent),var(--accent-2));color:#fff;
            font-size:13px;font-weight:700;font-family:inherit;cursor:pointer;
            transition:var(--transition);white-space:nowrap;
            box-shadow:0 4px 18px var(--accent-glow);
        }
        .load-btn:hover{transform:translateY(-1px);box-shadow:0 6px 24px var(--accent-glow)}
        .load-btn:active{transform:scale(.97)}

        /* Section divider */
        .divider{height:1px;background:linear-gradient(90deg,transparent,var(--border),transparent);margin:16px 0}

        /* Source tags */
        .source-tag{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:var(--radius-full);font-size:11px;font-weight:600}
        .source-tag.netease{background:rgba(180,120,255,.15);color:#c49bff}
        .source-tag.tencent{background:rgba(255,160,50,.15);color:#ffb347}

        @media(max-width:768px){
            .container{padding:0 16px}
            .playlist-head{flex-direction:column;align-items:flex-start;gap:16px}
            .playlist-cover{width:120px;height:120px}
            .form-grid{grid-template-columns:1fr 1fr}
            .form-grid .form-group:nth-child(3){grid-column:span 2}
            .form-grid .load-btn{grid-column:span 2}
        }
        @media(max-width:480px){
            .playlist-cover{width:100px;height:100px}
            .nav-inner{padding:12px 16px}
            .form-grid{grid-template-columns:1fr}
            .form-grid .form-group:nth-child(3){grid-column:auto}
            .form-grid .load-btn{grid-column:auto}
        }
    </style>
</head>
<body>

<nav class="nav">
    <div class="nav-inner">
        <a href="../" class="nav-logo">
            <div class="nav-logo-icon">🎵</div>
            Meting
        </a>
        <div class="nav-actions">
            <a href="../" class="back-btn">← 返回首页</a>
        </div>
    </div>
</nav>

<div class="container">
    <script src="https://unpkg.com/aplayer/dist/APlayer.min.js"></script>
    <script>
        window.meting_api = window.location.origin + '/?server=:server&type=:type&id=:id&auth=:auth&r=:r';
    </script>
    <script src="https://unpkg.com/@xizeyoupan/meting@latest/dist/Meting.min.js"></script>

    <!-- 自定义加载器 -->
    <section class="form-section">
        <div class="form-card">
            <div class="form-title">🎛️ 加载你的歌单</div>
            <div class="form-grid">
                <div class="form-group">
                    <label>数据源</label>
                    <select id="f-server">
                        <option value="netease">netease（网易云）</option>
                        <option value="tencent">tencent（QQ音乐）</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>类型</label>
                    <select id="f-type">
                        <option value="playlist">playlist（歌单）</option>
                        <option value="song">song（单曲）</option>
                        <option value="artist">artist（歌手）</option>
                        <option value="search">search（搜索）</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>ID / 关键词</label>
                    <input id="f-id" type="text" placeholder="歌单ID / 歌曲ID / 关键词" value="2619366284">
                </div>
                <button class="load-btn" onclick="loadCustom()">▶ 加载</button>
            </div>
        </div>
    </section>

    <div id="customArea"></div>

    <div class="divider"></div>

    <!-- 网易云 -->
    <section class="playlist-block">
        <div class="playlist-head">
            <div class="playlist-cover">
                <img src="../?server=netease&type=pic&id=2100968507" alt="">
            </div>
            <div class="playlist-info">
                <div class="playlist-label">NETEASE · FEATURED PLAYLIST</div>
                <div class="playlist-title">云音乐飙升榜</div>
                <div class="playlist-sub">每周更新 · 热歌速递 <span class="source-tag netease" style="margin-left:10px">网易云音乐</span></div>
            </div>
        </div>
        <div class="player-card">
            <meting-js server="netease" type="playlist" id="2619366284" list-folded="true"></meting-js>
        </div>
    </section>

    <!-- 网易云单曲 -->
    <section class="playlist-block" style="padding-top:0">
        <div class="playlist-head">
            <div class="playlist-cover">
                <img src="../?server=netease&type=pic&id=2100968507" alt="">
            </div>
            <div class="playlist-info">
                <div class="playlist-label">NETEASE · SONG</div>
                <div class="playlist-title">周杰伦 - 稻香</div>
                <div class="playlist-sub">经典单曲 <span class="source-tag netease" style="margin-left:10px">网易云音乐</span></div>
            </div>
        </div>
        <div class="player-card">
            <meting-js server="netease" type="song" id="416892104" list-folded="true"></meting-js>
        </div>
    </section>

    <div class="divider"></div>

    <!-- QQ音乐 -->
    <section class="playlist-block">
        <div class="playlist-head">
            <div class="playlist-cover">
                <img src="../?server=tencent&type=pic&id=0038ZG5W3EBBG9" alt="">
            </div>
            <div class="playlist-info">
                <div class="playlist-label">TENCENT · PLAYLIST</div>
                <div class="playlist-title">QQ 音乐精选歌单</div>
                <div class="playlist-sub">注意：海外 IP 可能无法播放 <span class="source-tag tencent" style="margin-left:10px">QQ 音乐</span></div>
            </div>
        </div>
        <div class="player-card">
            <meting-js server="tencent" type="playlist" id="9697595502" list-folded="true"></meting-js>
        </div>
    </section>

</div>

<script>
// 支持 URL 参数自动加载
(function(){
    const params = new URLSearchParams(window.location.search);
    const s = params.get('server');
    const t = params.get('type');
    const id = params.get('id');
    if(s && t && id){
        document.getElementById('f-server').value = s;
        document.getElementById('f-type').value = t;
        document.getElementById('f-id').value = id;
        loadCustom();
    }
})();

function loadCustom(){
    var server = document.getElementById('f-server').value;
    var type = document.getElementById('f-type').value;
    var id = document.getElementById('f-id').value.trim();
    if(!id){ alert('请输入 ID 或关键词'); return; }

    var area = document.getElementById('customArea');
    area.innerHTML = '';

    var section = document.createElement('section');
    section.className = 'playlist-block';
    section.style.animation = 'fadeUp .4s ease';
    section.innerHTML =
        '<div class="playlist-head">' +
            '<div class="playlist-cover">' +
                '<img src="../?server='+server+'&type=pic&id='+(type==='playlist'?id:'2100968507')+'" alt="" onerror="this.style.background=\'linear-gradient(135deg,#2a2a3a,#1a1a28)\'">' +
            '</div>' +
            '<div class="playlist-info">' +
                '<div class="playlist-label">'+server.toUpperCase()+' · '+type.toUpperCase()+'</div>' +
                '<div class="playlist-title">自定义加载</div>' +
                '<div class="playlist-sub">ID: '+id+' <span class="source-tag '+(server==='netease'?'netease':'tencent')+'" style="margin-left:10px">'+(server==='netease'?'网易云':'QQ音乐')+'</span></div>' +
            '</div>' +
        '</div>' +
        '<div class="player-card">' +
            '<meting-js server="'+server+'" type="'+type+'" id="'+id+'" list-folded="false"></meting-js>' +
        '</div>';
    area.appendChild(section);
    area.scrollIntoView({behavior:'smooth',block:'start'});
}
</script>
</body>
</html>
